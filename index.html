<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>093李嘉依</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-size: 18px;
            font-weight: 400;
            color: #000000;
            list-style-type: none;
            text-decoration: none;
            box-sizing: border-box;
            font-family: "微软雅黑";
            line-height: 60px;
        }
        body{
            background-color:#d3e1ff;
        }
        .yijihezi{
            width: 120px;
            margin: 54px 0 0 100px;
        }
        .yijiliebiao{
            width: 120px;
        }
        .yijiliebiao>li{
            width: 120px;
            height: 140px;
            position: relative;
        }
        li{
            display: flex;
            justify-content: center;
        }
        .erjihezi{
            position: absolute;
            left:120px;
            top:0;
            background-color: rgb(255 255 255 / 0.8);
            padding: 0;
            width: 0;
            overflow: hidden;
            transition: all 300ms linear;
        }
        .erjihezi a{
            color: black;
            font-size: 16px;
            line-height: 40px;
        }
        .erjiliebiao>li{
            width: 120px;
            height: 40px;
        }
        .yijiliebiao>li:hover .erjihezi{
            width: 360px;
            padding: 10px 0;
        }
        .yijiliebiao>li>a::after{
            content: '';
            position: absolute;
            left: 0;
            width: 120px;
            height: 0;
            background-color: #287193;
            z-index: -1;
            transition: all 300ms linear;
        }
        .yijiliebiao>li:hover a::after{
            height: 60px;
        }
    </style>
</head>
<body>
    <div class="yijihezi">
        <ul class="yijiliebiao">
            <li>
                <a href="#">国内游</a>
                <div class="erjihezi">
                    <ul class="erjiliebiao">
                        <li><a href="#">云南</a></li>
                        <li><a href="#">四川</a></li>
                        <li><a href="#">新疆</a></li>
                    </ul>
                </div>
            </li>
            <li>
                <a href="#">境外游</a>
                <div class="erjihezi">
                    <ul class="erjiliebiao">
                        <li><a href="#">泰国</a></li>
                        <li><a href="#">新加坡</a></li>
                        <li><a href="#">马来西亚</a></li>
                    </ul>
                </div>
            </li>
            <li>
                <a href="#">特色服务</a>
                <div class="erjihezi">
                    <ul class="erjiliebiao">
                        <li><a href="#">民宿预订</a></li>
                        <li><a href="#">跟团路线</a></li>
                        <li><a href="#">包车出行</a></li>
                    </ul>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
